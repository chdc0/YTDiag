name: build-ytdiag

# Builds YTDiag.dylib on a macOS runner and uploads it as an artifact.
# Windows has no iOS toolchain, so this is the only compile path.

on:
  workflow_dispatch:
  # push triggers removed 2026-11-04: YTDiag is finished, and "Sources/**" would also fire on
  # MGLoader edits, burning macOS minutes (10x multiplier on private repos) for nothing.

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: YTDiag
          path: out/YTDiag.dylib
          if-no-files-found: error
